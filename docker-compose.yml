services:
  redis:
    image: redis:7-alpine
    container_name: system3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  strategy:
    build: .
    container_name: system3-strategy
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    command: python dca_strategy.py --symbol BTC/USDT
    depends_on:
      - redis

  executor-extended:
    build: .
    container_name: system3-executor-extended
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    command: python -m executor.extended_executor
    depends_on:
      - redis

  executor-lighter:
    build: .
    container_name: system3-executor-lighter
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    command: python -m executor.lighter_executor
    depends_on:
      - redis

  fetcher:
    build: .
    container_name: system3-fetcher
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    command: python -m src.continuous_fetcher --symbol BTC/USDT --timeframes 1h,1d
    depends_on:
      - redis

volumes:
  redis_data:
