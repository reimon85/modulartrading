services:
  redis:
    image: redis:7-alpine
    container_name: system3-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Base para evitar repetir configuración
  base:
    build: .
    volumes:
      - .:/home/appuser/app
    depends_on:
      - redis
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1

  strategy:
    extends: base
    container_name: system3-strategy
    command: python dca_strategy.py --symbol BTC/USDT

  executor-extended:
    extends: base
    container_name: system3-executor-extended
    command: python -m executor.extended_executor

  executor-lighter:
    extends: base
    container_name: system3-executor-lighter
    command: python -m executor.lighter_executor

  fetcher:
    extends: base
    container_name: system3-fetcher
    command: python -m src.continuous_fetcher --symbol BTC/USDT --timeframes 1h,1d

volumes:
  redis_data:
